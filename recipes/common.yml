---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      cleanup: true
      nonfree: rpmfusion
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    replace:
      - from-repo: rpmfusion-free-updates
        allow-erasing: true
        packages:
          - old: ffmpeg-free
            new: ffmpeg
    install:
      packages:
        - terra-release
        - ffmpegthumbnailer
        - gnome-tweaks
        - neovim
        - fish
        - chezmoi
        - ghostty
        - ripgrep

  - type: default-flatpaks
    configurations:
      - notify: false # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.mozilla.firefox
          - org.gnome.Loupe
          - com.stremio.Stremio
          - io.github.cleomenezesjr.Serigy
          - io.github.flattool.Ignition
          - md.obsidian.Obsidian
          - net.nokyan.Resources
          - org.localsend.localsend_app
          - org.nickvision.tubeconverter
          - com.mattjakeman.ExtensionManager
          - org.gnome.World.PikaBackup
          - org.gnome.Papers
      - scope: user # Also add Flathub user repo, but no user packages
        notify: false
      - scope: system
        notify: false
        repo:
          url: https://nightly.gnome.org/gnome-nightly.flatpakrepo
          name: gnome-nightly
          title: GNOME Nightly
        install:
          - org.tabos.stamp

  - type: gnome-extensions
    install:
      - AppIndicator and KStatusNotifierItem Support

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
